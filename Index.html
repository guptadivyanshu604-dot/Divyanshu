<!DOCTYPE html>
<html>
<head>
  <title>System Hack</title>
  <style>
    body {
      background: black;
      color: lime;
      font-family: monospace;
      font-size: 18px;
      padding: 20px;
    }
    #terminal {
      white-space: pre-line;
    }
  </style>
</head>
<body>
  <div id="terminal"></div>

  <script>
    const terminal = document.getElementById("terminal");
    const lines = [
      "Connecting to server...",
      "Access granted!",
      "Downloading files...",
      "Injecting virus...",
      "System files deleted!",
      "HAHA! You are hacked!"
    ];
    let i = 0;

    function typeLine() {
      if (i < lines.length) {
        terminal.innerHTML += lines[i] + "\\n";
        i++;
        setTimeout(typeLine, 1000);
      } else {
        setInterval(() => {
          terminal.innerHTML += "█";
        }, 200);
      }
    }

    typeLine();
  </script>
</body>
</html>
